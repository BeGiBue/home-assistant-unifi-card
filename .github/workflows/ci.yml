name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check bundle
        run: |
          test -s dist/unifi-network-card.js
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: unifi-network-card
          path: dist/unifi-network-card.js
          if-no-files-found: error

  browser:
    name: Browser layout and controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python test/browser.py

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    # Als offizieller Katalogeintrag muss auch die HACS-Prüfung erfolgreich sein.
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin
