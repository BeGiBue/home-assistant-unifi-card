name: Release

# Zwei Wege zum Release:
#  1. Tag pushen:            git tag v1.2.3 && git push origin v1.2.3
#  2. Actions -> Release -> "Run workflow" und die Version (z. B. 1.2.3) eintragen.
#     Der Workflow legt dann den Tag selbst an.
# Voraussetzung: Die CHANGELOG.md hat einen Abschnitt "## 1.2.3"; er wird zum Release-Text.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version ohne führendes v (z. B. 1.2.3 oder 1.3.0-beta.1)"
        required: true
        type: string
      prerelease:
        description: "Als Pre-release markieren"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version bestimmen
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
            PRE="${INPUT_PRERELEASE}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            PRE=false
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Ungültige Version: '$VERSION' (erwartet z. B. 1.2.3)"
            exit 1
          fi
          # Versionen mit Suffix (-beta.1, -rc.1 …) sind automatisch Pre-releases
          case "$VERSION" in *-*) PRE=true ;; esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

      - name: Prüfen, ob der Tag schon existiert
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.v.outputs.tag }}" >/dev/null; then
            echo "::error::Tag ${{ steps.v.outputs.tag }} existiert bereits."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Der Release-Text kommt aus der CHANGELOG.md (Abschnitt "## x.y.z"), nicht aus einem automatischen Diff-Link.
      # Fehlt der Abschnitt, bricht der Release hier ab, bevor etwas veröffentlicht wird.
      - name: Release-Text aus dem Changelog
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: npm run build

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          FLAGS=(--notes-file "$RUNNER_TEMP/notes.md" --title "$TAG")
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); else FLAGS+=(--latest); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release existiert schon (z. B. manuell als Entwurf angelegt): Datei und Text ersetzen
            gh release upload "$TAG" dist/unifi-network-card.js --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            # --target legt den Tag bei workflow_dispatch am aktuellen Commit an;
            # bei einem Tag-Push existiert er bereits und wird unverändert verwendet.
            gh release create "$TAG" dist/unifi-network-card.js --target "$GITHUB_SHA" "${FLAGS[@]}"
          fi
